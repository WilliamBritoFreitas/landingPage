<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffe Delivery</title>
  <link rel="stylesheet" href="./landingpage.css" />
</head>

<body>
  <header>
    <img src="./assets/Logo.svg" alt="logo Coffe Delivery" />
    <div class="div-header-right">
      <div class="div-local">
        <img src="./assets_02/map_pin.svg" alt="Pino localizador" />
        <span>Porto Alegre,RS</span>
      </div>

      <div class="btn-car">
        <button>
          <img src="./assets/carrinho_amarelo.png" alt="carrinho" />
        </button>
      </div>
    </div>
  </header>
  <main>
    <div class="painel_principal">
      <div class="PP_col_01">
        <div class="c1_box1">
          <h1>
            Encontre o café perfeito para qualquer hora do dia
          </h1>
          <p>Com o Coffee Delivery você recebe seu café onde estiver, a qualquer hora</p>
        </div>

        <div class="c1_box2">
          <div class="vantagens">
            <img src="./assets/carrinho.png" alt="">
            <span>Compra simples e segura</span>
          </div>
          <div class="vantagens">
            <img src="./assets/embalagem.png" alt="">
            <span>Embalagem mantém o café intactos</span>
          </div>
              <div class="vantagens">
                <img src="./assets/temporizador.png" alt="">
                <span>Entrega rápida e rastreada</span>
              </div>
              <div class="vantagens">
                <img src="./assets/cafezinho.png" alt="">
                <span>O café chega fresquinho até você</span>
              </div>
        </div>
      </div>

      <div class="coluna_02">
        <img src="./assets/copo_cafe.svg" alt="Copo de Café">
      </div>

    </div>
  </main>
</body>

</html>
